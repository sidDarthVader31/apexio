apiVersion: v1
kind: Service
metadata:
  name: writer
  labels:
    app.kubernetes.io/name: writer
    app.kubernetes.io/part-of: apexio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: writer
  ports:
    - name: health
      port: 8081
      targetPort: health
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  labels:
    app.kubernetes.io/name: writer
    app.kubernetes.io/part-of: apexio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: writer
        app.kubernetes.io/part-of: apexio
    spec:
      initContainers:
        - name: wait-redpanda
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup redpanda.apexio.svc.cluster.local >/dev/null 2>&1; do
                echo "waiting for redpanda DNS"
                sleep 2
              done
      containers:
        - name: writer
          image: apexio-writer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: health
          env:
            - name: WRITER_HEALTH_ADDR
              value: ":8081"
            - name: REDPANDA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: apexio-config
                  key: REDPANDA_BROKERS
            - name: REDPANDA_CLIENT_ID
              value: apexio-writer
            - name: REDPANDA_GROUP_ID
              value: apexio-writer
            - name: LOG_TOPIC
              value: logs.ingestion.raw.v1
            - name: CLICKHOUSE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: apexio-config
                  key: CLICKHOUSE_ADDR
            - name: CLICKHOUSE_DATABASE
              value: apexio
            - name: CLICKHOUSE_TABLE
              value: logs
            - name: CLICKHOUSE_USER
              value: default
            - name: WRITER_BATCH_SIZE
              value: "50"
            - name: WRITER_FLUSH_INTERVAL
              value: 1s
            - name: WRITER_MAX_RETRIES
              value: "3"
            - name: WRITER_RETRY_BACKOFF
              value: 200ms
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
