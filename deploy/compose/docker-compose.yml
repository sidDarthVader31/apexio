# Apexio compose: Redpanda + ClickHouse + Grafana + gateway + writer
# Usage (from repo root):
#   make up
#   docker compose -f deploy/compose/docker-compose.yml up -d --build

name: apexio

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: apexio-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: apexio-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: apexio
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: apexio-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok\\|database'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  gateway:
    build:
      context: ../..
      dockerfile: cmd/gateway/Dockerfile
    image: apexio-gateway:local
    container_name: apexio-gateway
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      GATEWAY_ADDR: ":8080"
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_CLIENT_ID: apexio-gateway
      LOG_TOPIC: logs.ingestion.raw.v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  writer:
    build:
      context: ../..
      dockerfile: cmd/writer/Dockerfile
    image: apexio-writer:local
    container_name: apexio-writer
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      WRITER_HEALTH_ADDR: ":8081"
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_CLIENT_ID: apexio-writer
      REDPANDA_GROUP_ID: apexio-writer
      LOG_TOPIC: logs.ingestion.raw.v1
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: apexio
      CLICKHOUSE_TABLE: logs
      CLICKHOUSE_USER: default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  redpanda-data:
  clickhouse-data:
  grafana-data:
